root = "."
tmp_dir = "tmp"

[build]
bin = "./tmp/openmcdb"
cmd = "go build -buildvcs=false -o ./tmp/openmcdb ./cmd/openmcdb"
entrypoint = ["./tmp/openmcdb"]
full_bin = "cd tmp && ./openmcdb"
delay = 1000
exclude_dir = ["tmp"]
exclude_regex = ["_test.go"]
include_ext = ["go", "html", "js", "tmpl"]
kill_delay = "500ms"
log = "build-errors.log"
send_interrupt = true
stop_on_error = true

[build.windows]
bin = "tmp\\openmcdb.exe"
cmd = "go build -buildvcs=false -o ./tmp/openmcdb.exe ./cmd/openmcdb"
entrypoint = ["tmp\\openmcdb.exe"]
full_bin = "cd tmp; .\\openmcdb.exe"

[log]
time = false

[color]
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[misc]
clean_on_exit = true
